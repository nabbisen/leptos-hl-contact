[package]
name = "leptos-hl-contact"
description = "A reusable, secure contact form plugin for Leptos v0.8 with pluggable delivery backends."
keywords = ["leptos", "contact-form", "email", "smtp", "webassembly"]
categories = ["web-programming", "email"]
homepage = "https://github.com/nabbisen/leptos-hl-contact"
documentation = "https://docs.rs/leptos-hl-contact"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
hydrate = ["leptos/hydrate"]
ssr = ["leptos/ssr"]
islands = ["leptos/islands"]
smtp-lettre = ["ssr", "dep:lettre", "dep:tokio"]
axum-helpers = ["ssr", "dep:leptos_axum", "dep:axum"]
form-token = ["ssr", "dep:hmac", "dep:sha2", "dep:rand", "dep:hex"]
# Built-in verifiers that call the vendors' siteverify endpoints.
challenge-http = ["ssr", "dep:reqwest"]

[dependencies]
leptos = { version = "0.8", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
validator = { version = "0.20", features = ["derive"] }
tracing = "0.1"

# SSR-only (optional)
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true }

# SMTP (optional, smtp-lettre feature)
lettre = { version = "0.11", features = ["smtp-transport", "tokio1", "tokio1-native-tls", "builder", "hostname"], default-features = false, optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

# Form token (optional, form-token feature)
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
rand = { version = "0.9", optional = true }
hex = { version = "0.4", optional = true }

# Challenge verification over HTTP (optional, challenge-http feature).  rustls
# only, so there is no second TLS stack and no system library to install.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"], optional = true }

# Native-only: tokio's `net` and `rt-multi-thread` do not build for wasm32, and
# the browser tests below are the only tests compiled for it.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# `net`, `io-util`, `sync` and `time` run the local siteverify responder in
# the challenge-http tests.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
# Server integration suite (tests/server): the router is driven in process
# with `tower::ServiceExt::oneshot`; `leptos_router` gives the test app a
# `/contact` route; `tracing-subscriber` captures log events.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
leptos_router = "0.8"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
# Sign a past-dated form token in the documented format, for the expiry case
# (no sleeping); the same crates the form token itself uses.
hmac = "0.13"
sha2 = "0.11"

# Browser tests (tests/browser), run in headless Chromium.  wasm-bindgen-test
# is pinned exactly: 0.3.71 is the release that requires the wasm-bindgen the
# workspace lock resolves (0.2.121), and a caret requirement lets Cargo pick a
# newer one that moves wasm-bindgen for the whole workspace.  CI installs
# `wasm-bindgen-cli` at the version read from Cargo.lock.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.71"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlFormElement",
    "HtmlHeadElement",
    "HtmlInputElement",
    "MessageChannel",
    "MessagePort",
    "NodeList",
    "Request",
    "Response",
    "ResponseInit",
    "Window",
] }
