[package]
name = "leptos-hl-contact"
description = "A reusable, secure contact form plugin for Leptos v0.8 with pluggable delivery backends."
keywords = ["leptos", "contact-form", "email", "smtp", "webassembly"]
categories = ["web-programming", "email"]
homepage = "https://github.com/nabbisen/leptos-hl-contact"
documentation = "https://docs.rs/leptos-hl-contact"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
hydrate = ["leptos/hydrate"]
ssr = ["leptos/ssr", "dep:send_wrapper", "dep:getrandom", "dep:getrandom_04"]
islands = ["leptos/islands"]
smtp-lettre = ["ssr", "dep:lettre", "dep:tokio", "delivery-timeout"]
# `DeliveryTimeout`: a deadline for any delivery backend.  Its timer is
# declared here rather than left to arrive through lettre.
delivery-timeout = ["ssr", "dep:tokio", "tokio/time", "dep:js-sys", "dep:wasm-bindgen"]
axum-helpers = ["ssr", "dep:leptos_axum", "dep:axum"]
form-token = ["ssr", "dep:hmac", "dep:sha2", "dep:rand", "dep:hex", "dep:js-sys"]
# Built-in verifiers that call the vendors' siteverify endpoints.
challenge-http = [
    "ssr",
    "dep:reqwest",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[dependencies]
leptos = { version = "0.8", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
validator = { version = "0.20", features = ["derive"] }
tracing = "0.1"

# SSR-only (optional).  No default features: the application chooses them.  A
# native Axum application depends on `leptos_axum` with its defaults, because it
# calls `leptos_routes_with_context`; a Cloudflare Worker enables its `wasm`
# feature instead, which brings no tokio (RFC 011 D6).
leptos_axum = { version = "0.8", optional = true, default-features = false }
axum = { version = "0.8", optional = true, default-features = false }

# SMTP (optional, smtp-lettre feature)
lettre = { version = "0.11", features = ["smtp-transport", "tokio1", "tokio1-native-tls", "builder", "hostname"], default-features = false, optional = true }

# Form token (optional, form-token feature)
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
rand = { version = "0.9", optional = true }
hex = { version = "0.4", optional = true }

# Native only: a Cloudflare Worker has no tokio runtime (RFC 011 D6, D7).
# `smtp-lettre` and `delivery-timeout` still name it; on wasm32 it is inert.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt"], optional = true }
# Challenge verification over HTTP (optional, challenge-http feature).  rustls
# only, so there is no second TLS stack and no system library to install.  On
# a wasm32 server `HttpChallengeVerifier` uses `fetch` instead (RFC 011 D3).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"], optional = true }

# wasm32 server only (RFC 011 D2): `submit_contact` awaits extension futures
# that need not be `Send` through `SendWrapper`.  `ssr` enables it; a browser
# build never enables `ssr`, and on native it is not compiled.
[target.'cfg(target_arch = "wasm32")'.dependencies]
send_wrapper = { version = "0.6", features = ["futures"], optional = true }
# A Leptos server on wasm32 (Cloudflare Workers, RFC 011) pulls in two
# getrandom versions without their wasm backend: 0.3 through `rand` 0.9
# (this crate's form token, and Leptos's `nonce` feature) and 0.4 through
# Leptos's `nonce` feature, which leptos_axum enables.  Enabling `wasm_js`
# here lets a Workers build compile; 0.3 still needs the application's
# `--cfg getrandom_backend="wasm_js"`.  Drop the 0.4 entry once Leptos enables
# it for server builds itself.
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"], optional = true }
# A JavaScript clock (`form-token`, `delivery-timeout`) and timer
# (`delivery-timeout`) on a wasm32 server, which has no `SystemTime` and no
# tokio runtime (RFC 011 D4, D7).
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
# `HttpChallengeVerifier` over the global `fetch` (`challenge-http`, RFC 011 D3).
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "AbortController",
    "AbortSignal",
    "Headers",
    "Request",
    "RequestInit",
    "RequestRedirect",
    "Response",
    "UrlSearchParams",
] }

# Native-only: tokio's `net` and `rt-multi-thread` do not build for wasm32, and
# the browser tests below are the only tests compiled for it.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# `axum-helpers` no longer turns on their default features, so the unit tests
# and the server suite ask for them, as a native application does.
leptos_axum = "0.8"
axum = "0.8"
# `net`, `io-util`, `sync` and `time` run the local siteverify responder in
# the challenge-http tests.
# `test-util` pauses the clock, so no test waits for a delivery deadline.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "test-util"] }
# Server integration suite (tests/server): the router is driven in process
# with `tower::ServiceExt::oneshot`; `leptos_router` gives the test app a
# `/contact` route; `tracing-subscriber` captures log events.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
leptos_router = "0.8"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
# Sign a past-dated form token in the documented format, for the expiry case
# (no sleeping); the same crates the form token itself uses.
hmac = "0.13"
sha2 = "0.11"

# Browser tests (tests/browser), run in headless Chromium.  wasm-bindgen-test
# is pinned exactly: 0.3.71 is the release that requires the wasm-bindgen the
# workspace lock resolves (0.2.121), and a caret requirement lets Cargo pick a
# newer one that moves wasm-bindgen for the whole workspace.  CI installs
# `wasm-bindgen-cli` at the version read from Cargo.lock.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.71"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AbortSignal",
    "Document",
    "Element",
    "Headers",
    "HtmlElement",
    "HtmlFormElement",
    "HtmlHeadElement",
    "HtmlInputElement",
    "MessageChannel",
    "MessagePort",
    "NodeList",
    "Request",
    "RequestRedirect",
    "Response",
    "ResponseInit",
    "Window",
] }
