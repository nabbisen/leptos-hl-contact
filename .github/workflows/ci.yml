name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, checked 2026-09-22
        with:
          toolchain: "1.91"
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # --all-features always turns `form-token` on, so warnings that only
      # appear in other feature combinations are invisible to the step above.
      - name: clippy (ssr without form-token)
        run: cargo clippy --all-targets --no-default-features --features ssr,smtp-lettre,axum-helpers -- -D warnings

      # `default = []` on wasm32 (NFR-PORT-01): nothing else in CI builds the
      # crate for wasm32 without `hydrate`.
      - name: check (wasm32, default features)
        run: cargo check -p leptos-hl-contact --target wasm32-unknown-unknown

      # Cloudflare Workers (RFC 011): the server path on wasm32, no tokio runtime.
      # `--lib --test worker`, not `--tests`: the unit tests and the server suite
      # need tokio, which is native-only.
      - name: check (wasm32 server, Workers features)
        run: >-
          cargo clippy -p leptos-hl-contact --target wasm32-unknown-unknown
          --no-default-features --features ssr,form-token,challenge-http,delivery-resend,axum-helpers,delivery-timeout
          --lib --test worker -- -D warnings

      - name: test
        run: cargo test --all-features

      # rustdoc warnings (broken intra-doc links, say) never fail `cargo doc`
      # on their own.
      - name: doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps

  # RFC 016 D1: the crate claims Rust 1.88 as its minimum, so build (never
  # lint or test — lint sets differ between versions, and this promise is
  # about building) on 1.88 itself.  A failure here means a dependency raised
  # the MSRV; that is an owner decision, not something to work around.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, checked 2026-09-22
        with:
          toolchain: "1.88"
          targets: wasm32-unknown-unknown

      - name: check (native, all features)
        run: cargo check -p leptos-hl-contact --all-features --locked

      - name: check (wasm32, hydrate)
        run: cargo check -p leptos-hl-contact --target wasm32-unknown-unknown --features hydrate --locked

      - name: check (wasm32 server, Workers features)
        run: >-
          cargo check -p leptos-hl-contact --target wasm32-unknown-unknown
          --no-default-features --features ssr,form-token,challenge-http,delivery-resend,axum-helpers,delivery-timeout
          --locked

  # Browser tests (RFC 008 L3): `ContactForm` mounted in headless Chrome, with
  # server functions answered by a stubbed `fetch`.  Owner decision: every push.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, checked 2026-09-22
        with:
          toolchain: "1.91"
          targets: wasm32-unknown-unknown

      # The test runner refuses a wasm-bindgen other than its own, so its
      # version is read from Cargo.lock, never written here.
      - name: wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      # Chrome and chromedriver both come from the runner image, which keeps
      # them in step; print them so a mismatch is visible in the log.
      - name: versions
        run: |
          wasm-bindgen-test-runner --version
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version

      - name: browser tests
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test -p leptos-hl-contact --target wasm32-unknown-unknown --features hydrate --test browser

      # The server path on wasm32 (RFC 011): the form token's JavaScript clock,
      # `DeliveryTimeout`'s JavaScript timer and `HttpChallengeVerifier` over
      # `fetch`, run in headless Chrome.
      - name: worker tests (server features on wasm32)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test -p leptos-hl-contact --target wasm32-unknown-unknown --no-default-features --features ssr,form-token,challenge-http,delivery-resend,delivery-timeout --test worker

  # Examples are excluded from the workspace (see Cargo.toml), so the `check`
  # job never compiles them.  Separate job so a slow example build does not
  # delay the crate gates.
  examples:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        include:
          # Server-only; no features to select.
          - example: axum-basic
            features: ""
          # cargo-leptos layout: the binary needs `ssr`, and the WASM client is
          # checked separately in the step below.
          - example: axum-with-security
            features: "--features ssr"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, checked 2026-09-22
        with:
          toolchain: "1.91"
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      # `--locked`: a change to the crate's dependencies changes the examples'
      # lock files, and only `--locked` notices.  Handoff 016-01 made `subtle`
      # a direct dependency and the stale lock survived CI (fixed in cff320e).
      - name: check
        run: cargo check --locked ${{ matrix.features }}
        working-directory: examples/${{ matrix.example }}

      # The WASM client is what makes hydration testable; cargo-leptos itself
      # is not run in CI.
      - name: check (wasm client)
        if: matrix.example == 'axum-with-security'
        run: cargo check --locked --features hydrate --target wasm32-unknown-unknown --lib
        working-directory: examples/${{ matrix.example }}
