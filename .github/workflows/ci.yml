name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@1.91
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # --all-features always turns `form-token` on, so warnings that only
      # appear in other feature combinations are invisible to the step above.
      - name: clippy (ssr without form-token)
        run: cargo clippy --all-targets --no-default-features --features ssr,smtp-lettre,axum-helpers -- -D warnings

      # `default = []` on wasm32 (NFR-PORT-01): nothing else in CI builds the
      # crate for wasm32 without `hydrate`.
      - name: check (wasm32, default features)
        run: cargo check -p leptos-hl-contact --target wasm32-unknown-unknown

      # Cloudflare Workers (RFC 011): the server path on wasm32, no tokio runtime.
      # `challenge-http` joins this list in handoff 011-03.  `--lib --test
      # worker`, not `--tests`: the unit tests and the server suite need tokio,
      # which is native-only.
      - name: check (wasm32 server, Workers features)
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: >-
          cargo clippy -p leptos-hl-contact --target wasm32-unknown-unknown
          --no-default-features --features ssr,form-token,axum-helpers,delivery-timeout
          --lib --test worker -- -D warnings

      - name: test
        run: cargo test --all-features

      # rustdoc warnings (broken intra-doc links, say) never fail `cargo doc`
      # on their own.
      - name: doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps

  # Browser tests (RFC 008 L3): `ContactForm` mounted in headless Chrome, with
  # server functions answered by a stubbed `fetch`.  Owner decision: every push.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@1.91
        with:
          targets: wasm32-unknown-unknown

      # The test runner refuses a wasm-bindgen other than its own, so its
      # version is read from Cargo.lock, never written here.
      - name: wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      # Chrome and chromedriver both come from the runner image, which keeps
      # them in step; print them so a mismatch is visible in the log.
      - name: versions
        run: |
          wasm-bindgen-test-runner --version
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version

      - name: browser tests
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test -p leptos-hl-contact --target wasm32-unknown-unknown --features hydrate --test browser

      # The server path on wasm32 (RFC 011): the form token's JavaScript clock
      # and `DeliveryTimeout`'s JavaScript timer, run in headless Chrome.
      - name: worker tests (server features on wasm32)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test -p leptos-hl-contact --target wasm32-unknown-unknown --no-default-features --features ssr,form-token,delivery-timeout --test worker

  # Examples are excluded from the workspace (see Cargo.toml), so the `check`
  # job never compiles them.  Separate job so a slow example build does not
  # delay the crate gates.
  examples:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        include:
          # Server-only; no features to select.
          - example: axum-basic
            features: ""
          # cargo-leptos layout: the binary needs `ssr`, and the WASM client is
          # checked separately in the step below.
          - example: axum-with-security
            features: "--features ssr"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@1.91
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: check
        run: cargo check ${{ matrix.features }}
        working-directory: examples/${{ matrix.example }}

      # The WASM client is what makes hydration testable; cargo-leptos itself
      # is not run in CI.
      - name: check (wasm client)
        if: matrix.example == 'axum-with-security'
        run: cargo check --features hydrate --target wasm32-unknown-unknown --lib
        working-directory: examples/${{ matrix.example }}
